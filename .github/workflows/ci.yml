name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build:lib
      - run: npx size-limit
      - run: npx playwright install --with-deps chromium
      - run: npm run test -- run

  release:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci
      # Trusted Publishing (OIDC) requires npm CLI >= 11.5.1; setup-node's
      # bundled npm on ubuntu-latest may be older.
      - run: npm install -g npm@latest

      - name: Check for pending changesets
        id: changesets
        run: |
          if compgen -G ".changeset/*.md" > /dev/null && [ -n "$(find .changeset -maxdepth 1 -name '*.md' ! -name README.md)" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Version, commit, and publish
        if: steps.changesets.outputs.pending == 'true'
        run: |
          SUMMARY=$(node scripts/changeset-summary.mjs)
          npm run version-packages
          NEW_VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v$NEW_VERSION: $SUMMARY"
          npm run release
          git push origin HEAD:main --follow-tags
